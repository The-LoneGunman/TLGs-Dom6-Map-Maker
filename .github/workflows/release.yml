name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - name: Verify tag matches package version
        run: node -e 'const expected = `v${require("./package.json").version}`; if (process.env.GITHUB_REF_NAME !== expected) { console.error(`Release tag ${process.env.GITHUB_REF_NAME} must equal ${expected}.`); process.exit(1); }'
      - name: Verify release candidate
        run: |
          node scripts/start-atlas.mjs --self-test
          npm run licenses:check
          npm run typecheck
          npm test
          npm run lint
      - name: Assemble tested Windows bundle
        run: |
          release_root="$RUNNER_TEMP/pantokrator-release"
          rm -rf "$release_root"
          mkdir -p "$release_root/Pantokrator-Atlas"
          git archive "$GITHUB_SHA" | tar -x -C "$release_root/Pantokrator-Atlas"
          cp -R dist "$release_root/Pantokrator-Atlas/dist"
          printf '%s\n' "$GITHUB_SHA" > "$release_root/Pantokrator-Atlas/dist/.pantokrator-release-ready"
          test -f "$release_root/Pantokrator-Atlas/LICENSE"
          test -f "$release_root/Pantokrator-Atlas/THIRD_PARTY_LICENSES.txt"
          test -f "$release_root/Pantokrator-Atlas/src/catalog/data/NOTICE.md"
          test -f "$release_root/Pantokrator-Atlas/src/catalog/data/LICENSE.dom6inspector.txt"
          test ! -d "$release_root/Pantokrator-Atlas/node_modules"
          (cd "$release_root" && zip -q -r "$GITHUB_WORKSPACE/Pantokrator-Atlas-Windows.zip" Pantokrator-Atlas)
          sha256sum Pantokrator-Atlas-Windows.zip > Pantokrator-Atlas-Windows.zip.sha256
      - name: Smoke-test packaged release without npm install
        run: |
          cd "$RUNNER_TEMP/pantokrator-release/Pantokrator-Atlas"
          node scripts/start-atlas.mjs --prepare-only
          node scripts/start-atlas.mjs --smoke-test --no-browser
          node scripts/test-local-server.mjs
      - name: Upload exact Windows candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pantokrator-atlas-windows-candidate
          path: |
            Pantokrator-Atlas-Windows.zip
            Pantokrator-Atlas-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 1

  windows-gate:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download exact Windows candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pantokrator-atlas-windows-candidate
          path: candidate
      - name: Use supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Extract and smoke-test the exact downloadable ZIP
        shell: powershell
        run: |
          Expand-Archive -LiteralPath candidate/Pantokrator-Atlas-Windows.zip -DestinationPath candidate/extracted
          Set-Location candidate/extracted/Pantokrator-Atlas
          if (Test-Path node_modules) { throw "Release ZIP unexpectedly contains node_modules." }
          cmd /d /c call "Start Pantokrator Atlas.cmd" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Launcher self-test failed with exit $LASTEXITCODE." }
          cmd /d /c call "Start Pantokrator Atlas.cmd" --prepare-only
          if ($LASTEXITCODE -ne 0) { throw "Launcher preparation failed with exit $LASTEXITCODE." }
          cmd /d /c call "Start Pantokrator Atlas.cmd" --smoke-test --no-browser
          if ($LASTEXITCODE -ne 0) { throw "Launcher smoke failed with exit $LASTEXITCODE." }
          node scripts/test-local-server.mjs
      - name: Download verified private Node.js runtime
        shell: powershell
        run: |
          $nodeVersion = "22.23.2"
          $nodeArchiveName = "node-v$nodeVersion-win-x64.zip"
          $nodeArchive = Join-Path $env:RUNNER_TEMP $nodeArchiveName
          Invoke-WebRequest "https://nodejs.org/download/release/v$nodeVersion/$nodeArchiveName" -OutFile $nodeArchive
          $expected = "1177b4137ba5adaa56354ae40f1080c7450e8ae09cecb47da459d1c52ac99f97"
          $actual = (Get-FileHash -LiteralPath $nodeArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Node.js runtime checksum mismatch: $actual" }
          Expand-Archive -LiteralPath $nodeArchive -DestinationPath candidate/node
      - name: Stage installer payload
        shell: powershell
        run: |
          $releaseRoot = (Resolve-Path candidate/extracted/Pantokrator-Atlas).Path
          $nodeRoot = (Resolve-Path candidate/node/node-v22.23.2-win-x64).Path
          $payload = Join-Path $env:RUNNER_TEMP "pantokrator-installer-payload"
          node "$releaseRoot/scripts/stage-windows-installer.mjs" `
            --project-root $releaseRoot `
            --node-root $nodeRoot `
            --output $payload `
            --node-version v22.23.2
      - name: Install verified Inno Setup compiler
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force candidate/tools | Out-Null
          gh release download is-6_7_3 --repo jrsoftware/issrc --pattern innosetup-6.7.3.exe --dir candidate/tools
          Push-Location candidate/tools
          gh release verify-asset is-6_7_3 innosetup-6.7.3.exe --repo jrsoftware/issrc
          Pop-Location
          $compilerInstaller = (Resolve-Path candidate/tools/innosetup-6.7.3.exe).Path
          $signature = Get-AuthenticodeSignature -LiteralPath $compilerInstaller
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "Inno Setup compiler signature is not valid for Pyrsys B.V."
          }
          $innoRoot = Join-Path $env:RUNNER_TEMP "InnoSetup"
          $process = Start-Process -FilePath $compilerInstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$innoRoot`""
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed with exit $($process.ExitCode)." }
          if (-not (Test-Path (Join-Path $innoRoot "ISCC.exe"))) { throw "ISCC.exe was not installed." }
      - name: Compile and exercise the exact installer
        shell: powershell
        run: |
          $releaseRoot = (Resolve-Path candidate/extracted/Pantokrator-Atlas).Path
          $payload = Join-Path $env:RUNNER_TEMP "pantokrator-installer-payload"
          $output = Join-Path $env:GITHUB_WORKSPACE "candidate/installer"
          $installRoot = Join-Path $env:RUNNER_TEMP "Pantokrator Atlas installed"
          $version = (Get-Content "$releaseRoot/package.json" -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force $output | Out-Null
          $iscc = Join-Path $env:RUNNER_TEMP "InnoSetup/ISCC.exe"
          & $iscc "/DAppVersion=$version" "/DPayloadDir=$payload" "/O$output" "/FPantokrator-Atlas-Setup-x64" "$releaseRoot/installer/PantokratorAtlas.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed with exit $LASTEXITCODE." }
          $setup = Join-Path $output "Pantokrator-Atlas-Setup-x64.exe"
          if (-not (Test-Path $setup)) { throw "Installer output is missing." }

          $install = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installRoot`""
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit $($install.ExitCode)." }
          if (-not (Test-Path "$installRoot/runtime/node.exe")) { throw "Bundled Node.js runtime is missing." }
          if (-not (Test-Path "$installRoot/runtime/NODE_LICENSE.txt")) { throw "Bundled Node.js license is missing." }
          Push-Location $installRoot
          cmd /d /c call "Start Pantokrator Atlas.cmd" --prepare-only
          if ($LASTEXITCODE -ne 0) { throw "Installed launcher preparation failed with exit $LASTEXITCODE." }
          cmd /d /c call "Start Pantokrator Atlas.cmd" --smoke-test --no-browser
          if ($LASTEXITCODE -ne 0) { throw "Installed launcher smoke failed with exit $LASTEXITCODE." }
          Pop-Location

          $uninstaller = Join-Path $installRoot "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller is missing." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit $($uninstall.ExitCode)." }
          if (Test-Path "$installRoot/runtime/node.exe") { throw "Uninstaller left the private runtime behind." }

          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Pantokrator-Atlas-Setup-x64.exe" | Set-Content -LiteralPath "$output/Pantokrator-Atlas-Setup-x64.exe.sha256" -Encoding ascii
      - name: Upload verified Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pantokrator-atlas-windows-installer
          path: |
            candidate/installer/Pantokrator-Atlas-Setup-x64.exe
            candidate/installer/Pantokrator-Atlas-Setup-x64.exe.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: windows-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified Windows candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pantokrator-atlas-windows-candidate
      - name: Download verified Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pantokrator-atlas-windows-installer
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          Pantokrator-Atlas-Windows.zip
          Pantokrator-Atlas-Windows.zip.sha256
          Pantokrator-Atlas-Setup-x64.exe
          Pantokrator-Atlas-Setup-x64.exe.sha256
          --verify-tag
          --generate-notes
          --title "Pantokrator Atlas $GITHUB_REF_NAME"
