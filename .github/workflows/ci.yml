name: Release quality

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - name: Verify launcher internals
        run: node scripts/start-atlas.mjs --self-test
      - name: Verify third-party notices
        run: npm run licenses:check
      - name: Type-check application
        run: npm run typecheck
      - name: Run automated release suite
        run: npm test
      - name: Run static analysis
        run: npm run lint
      - name: Smoke-test dependency-free production server
        run: node scripts/test-local-server.mjs

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Exercise the double-click launcher path
        shell: cmd
        run: |
          call "Start Pantokrator Atlas.cmd" --self-test
          if errorlevel 1 exit /b %errorlevel%
          call "Start Pantokrator Atlas.cmd" --prepare-only
          if errorlevel 1 exit /b %errorlevel%
          call "Start Pantokrator Atlas.cmd" --smoke-test --no-browser
          if errorlevel 1 exit /b %errorlevel%
          node scripts/test-local-server.mjs
